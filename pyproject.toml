[project]
name = "fab_agent"
version = "0.1.0"
description = "LLM-based rules-adjudication agent for the trading card game Flesh and Blood"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "cmorganb", email = "cmorganb@outlook.com" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "pypdf>=4.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "openai>=1.35",
    "rapidfuzz>=3.14.5",
    "anthropic>=0.116.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fab_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
